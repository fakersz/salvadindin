server {
    listen 80;
    listen [::]:80;
    server_name salvadindin.online www.salvadindin.online;
    access_log /var/log/nginx/salvadindin.access.log salvadindin_safe;
    error_log /dev/null;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/salvadindin/acme;
        default_type text/plain;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name salvadindin.online www.salvadindin.online;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/salvadindin.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/salvadindin.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SalvaDinDinTLS:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    access_log /var/log/nginx/salvadindin.access.log salvadindin_safe;
    # Raw Nginx errors can include request secrets; safe status/timing remain in access logs.
    error_log /dev/null;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location / {
        proxy_pass http://127.0.0.1:15173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
