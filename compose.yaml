name: salvadindin-v2

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-salvadindin_v2}
      POSTGRES_USER: ${POSTGRES_USER:-salvadindin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 512m

  backend:
    build: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-salvadindin_v2}
      POSTGRES_USER: ${POSTGRES_USER:-salvadindin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-18000}:8000"
    networks: [application, database]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 384m
    init: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-15173}:8080"
    networks: [application]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 128m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

volumes:
  postgres_data:
    name: salvadindin_v2_postgres_data

networks:
  application:
    name: salvadindin_v2_application
  database:
    name: salvadindin_v2_database
    internal: true
